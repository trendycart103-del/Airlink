name: Build Airlink APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "SPASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KPASS=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "::warning::Secrets নেই — সাময়িক কী দিয়ে সাইন করা হচ্ছে"
            keytool -genkeypair -v -keystore release.jks -alias airlink \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass airlink123 -keypass airlink123 \
              -dname "CN=Airlink, O=Airlink, C=BD"
            echo "ALIAS=airlink" >> $GITHUB_ENV
            echo "SPASS=airlink123" >> $GITHUB_ENV
            echo "KPASS=airlink123" >> $GITHUB_ENV
          fi

      - name: Align and sign APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BT/zipalign -f -p 4 "$APK" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks release.jks --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$SPASS" --key-pass "pass:$KPASS" \
            --out Airlink.apk aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify Airlink.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Airlink-apk
          path: Airlink.apk

      - name: Publish GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Airlink.apk
