name: Build Airlink APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Locate Gradle project (unzip if needed)
        run: |
          SETTINGS=$(find . -maxdepth 4 -name "settings.gradle.kts" -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "Unzipping $ZIP"
              mkdir -p _src
              unzip -q -o "$ZIP" -d _src
              SETTINGS=$(find _src -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
            fi
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts বা প্রজেক্ট জিপ খুঁজে পাওয়া যায়নি"
            find . -maxdepth 3 -not -path "./.git/*" | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$(cd "$DIR" && pwd)" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK and accept licenses
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          ls "$SDK" || true
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          mkdir -p "$SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK/licenses/android-sdk-preview-license"
          echo "sdk.dir=$SDK" > "$PROJECT_DIR/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK (unsigned)
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit ${PIPESTATUS[0]}

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "SPASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KPASS=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "::warning::Secrets নেই — সাময়িক কী দিয়ে সাইন করা হচ্ছে"
            keytool -genkeypair -keystore "$GITHUB_WORKSPACE/release.jks" -alias airlink \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass airlink123 -keypass airlink123 \
              -dname "CN=Airlink, O=Airlink, C=BD"
            echo "ALIAS=airlink" >> $GITHUB_ENV
            echo "SPASS=airlink123" >> $GITHUB_ENV
            echo "KPASS=airlink123" >> $GITHUB_ENV
          fi

      - name: Align and sign APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          BTV=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          BT="$ANDROID_HOME/build-tools/$BTV"
          echo "Using build-tools $BTV"
          $BT/zipalign -f -p 4 "$APK" "$GITHUB_WORKSPACE/aligned.apk"
          $BT/apksigner sign \
            --ks "$GITHUB_WORKSPACE/release.jks" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$SPASS" --key-pass "pass:$KPASS" \
            --out "$GITHUB_WORKSPACE/Airlink.apk" "$GITHUB_WORKSPACE/aligned.apk"
          $BT/apksigner verify "$GITHUB_WORKSPACE/Airlink.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Airlink-apk
          path: Airlink.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Airlink.apk
