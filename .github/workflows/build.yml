name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release.jks

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Find the unsigned APK
        id: find
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk=$APK" >> $GITHUB_OUTPUT

      - name: Sign the APK
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BT/zipalign -f -p 4 "${{ steps.find.outputs.apk }}" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks $GITHUB_WORKSPACE/release.jks \
            --ks-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out Airlink.apk aligned.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Airlink.apk

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Airlink-apk
          path: Airlink.apk
